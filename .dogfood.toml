[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2"]
pitch = "A dark-mode hackathon management portal built with Next.js 14, PostgreSQL, and Prisma. Role-isolated judging, CSV export, and deadline enforcement backed by the fixture event's submissions_close date."

[auth]
# Generated and printed by seed script at startup
organizer   = "Cookie: session=org_dogfood_2026_master"
judge_a     = "Cookie: session=jdg_a_tomas_varga_2026"
judge_b     = "Cookie: session=jdg_b_wei_lindqvist_2026"
participant = "Cookie: session=prt_dogfood_2026_team"

[routes]
gallery      = "/projects"
submit       = "/projects/new"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores?judge=jdg_01"
csv_export   = "/api/export.csv"
