services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood2026"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:3000"
    env_file:
      - .env
    environment:
      # DATABASE_URL is defined in .env — override to use the internal container hostname
      DATABASE_URL: postgresql://dogfood:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      # Enable quick-access demo buttons in the login UI — safe for local/dev only.
      # Do NOT set this to "true" in any production environment.
      NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

# ─── Network ──────────────────────────────────────────────────────────────────
# Default bridge network only — no internet access required.
# Run with: docker compose up --build
# Portal: http://localhost:8080
# Checker: python3 run.py .dogfood.toml > acceptance-report.txt
